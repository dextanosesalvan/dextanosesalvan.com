<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEXTA NO SE SALVAN | Audio Architect Portfolio</title>
    <!-- FUENTES PREMIUM ESTILO PHARRELL / STREETWEAR -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- ICONOS CON CARGA SEGURA -->
    <link rel="stylesheet" href="https://cloudflare.com" crossorigin="anonymous" />
    
    <style>
        :root {
            --bg-pure: #ffffff;
            --text-dark: #000000;
            --text-muted: #71717a;
            --border-line: #000000;
            --font-header: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-dark);
            font-family: var(--font-body);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 80px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* --- CABECERA PRINCIPAL CON TU LOGO CENTRADO --- */
        header {
            text-align: center;
            padding: 50px 0 20px 0;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 2px solid var(--text-dark);
            margin-bottom: 35px;
        }

        .logo-image {
            width: 100%;
            max-width: 290px;
            height: auto;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .social-top-right {
            position: absolute;
            top: 75px;
            right: 0;
            display: flex;
            gap: 18px;
            z-index: 10;
        }

        .social-top-right a {
            color: var(--text-dark);
            font-size: 1.3rem;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.2s;
        }

        .social-top-right a:hover {
            opacity: 0.6;
            transform: translateY(-2px);
        }

        /* --- DISTRIBUCIÓN DEL ESPACIO DE TRABAJO --- */
        .workspace-layout {
            display: grid;
            grid-template-columns: 42% 58%;
            gap: 50px;
            align-items: start;
            min-height: 60vh;
        }

        /* Área Izquierda: Tu Avatar / Ilustración */
        .avatar-zone {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: sticky;
            top: 20px;
        }

        .avatar-box {
            width: 100%;
            max-width: 320px;
            padding-bottom: 120%;
            background-color: #f8f8f9;
            border: 2px dashed var(--text-dark);
            position: relative;
            margin-bottom: 25px;
        }

        .listen-tag {
            font-family: var(--font-header);
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-dark);
            border-bottom: 2px solid var(--text-dark);
            padding-bottom: 2px;
            transition: opacity 0.2s;
        }

        .listen-tag:hover {
            opacity: 0.6;
        }

        /* Área Derecha: Menú de Categorías */
        .interactive-menu {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .menu-instruction {
            font-family: var(--font-header);
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .category-nav {
            display: flex;
            gap: 24px;
            border-bottom: 2px solid var(--text-dark);
            padding-bottom: 14px;
            margin-bottom: 10px;
        }

        .cat-btn {
            font-family: var(--font-header);
            font-size: 1rem;
            font-weight: 700;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: color 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            color: var(--text-dark);
        }

        .cat-btn.active::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--text-dark);
        }

        /* --- PANELES CONTENEDORES DINÁMICOS --- */
        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        /* Bloques de diseño didáctico interno */
        .items-display-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .didactic-item {
            border: 2px solid var(--text-dark);
            padding: 22px 15px;
            text-align: center;
            font-family: var(--font-header);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            background-color: var(--bg-pure);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .didactic-item:hover {
            transform: scale(1.04) rotate(1.5deg);
            box-shadow: 4px 4px 0px var(--text-dark);
        }

        .didactic-item i {
            font-size: 1.8rem;
        }

        /* Cajas de texto descriptivas limpias */
        .info-box-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #18181b;
            background-color: #fafafa;
            border: 1px solid #e4e4e7;
            padding: 30px;
        }

        .info-box-text p {
            margin-bottom: 14px;
        }

        .info-box-text p:last-child {
            margin-bottom: 0;
        }

        .display-placeholder {
            width: 100%;
            padding-bottom: 58%;
            background-color: #fafafa;
            border: 1px solid #e4e4e7;
            position: relative;
            overflow: hidden;
            margin-top: 25px;
        }

        .display-placeholder img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        /* --- SECCIÓN CONCEPTO --- */
        .brand-meaning {
            margin-top: 40px;
            border-top: 1px solid #000;
            padding-top: 25px;
            max-width: 600px;
        }

        .brand-meaning h2 {
            font-family: var(--font-header);
            font-size: 1.3rem;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .brand-meaning p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .brand-meaning p span {
            color: var(--text-dark);
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .workspace-layout { grid-template-columns: 1fr; gap: 40px; }
            .social-top-right { position: relative; top: 0; right: 0; justify-content: center; margin-top: 20px; }
            header { padding-top: 30px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- CABECERA CON TU NUEVO LOGO REAL EN ALTA VELOCIDAD -->
        <header>
            <img src="https://postimg.cc" alt="Dexta No Se Salvan" class="logo-image">
            
            <div class="social-top-right">
                <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://tiktok.com" target="_blank"><i class="fab fa-tiktok"></i></a>
                <a href="https://kick.com" target="_blank"><i class="fa-solid fa-play"></i></a>
                <a href="https://spotify.com" target="_blank"><i class="fab fa-spotify"></i></a>
            </div>
        </header>

        <!-- ESPACIO DE TRABAJO DIDÁCTICO -->
        <div class="workspace-layout">
            
            <!-- COLUMNA IZQUIERDA: TU AVATAR -->
            <div class="avatar-zone">
                <div class="avatar-box">
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 20px;">
                        [ Drop your Character Artwork or Studio PNG Photo here ]
                    </div>
                </div>
                <a href="https://spotify.com" target="_blank" class="listen-tag">Listen to my Beats</a>
            </div>

            <!-- COLUMNA DERECHA: PANELES INTERACTIVOS INTERCAMBIABLES -->
            <div class="interactive-menu">
                <div>
                    <div class="menu-instruction">Select a Category & Explore Architecture</div>
                    
                    <!-- NAVEGACIÓN ENTRE PESTAÑAS (TABS) -->
                    <div class="category-nav">
