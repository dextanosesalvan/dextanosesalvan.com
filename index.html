<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dextano | Audio Architect & Producer</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-color: #050508;
            --card-bg: rgba(12, 12, 20, 0.85);
            --neon-cyan: #00f2fe;
            --neon-pink: #ff007f;
            --font-title: 'Syne', sans-serif;
            --font-text: 'Plus Jakarta Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: var(--font-text);
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px;
            background: radial-gradient(circle at 50% 30%, rgba(0, 242, 254, 0.08), transparent 60%);
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #fff, rgba(255,255,255,0.1));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-title);
            font-weight: 800;
            font-size: 1.8rem;
            color: #000;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }

        h1 {
            font-family: var(--font-title);
            font-size: 5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 20px;
            background: linear-gradient(180deg, #fff 50%, #666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 700px;
            line-height: 1.4;
            margin-bottom: 40px;
        }

        .tagline span.cyan { color: var(--neon-cyan); font-weight: 600; }
        .tagline span.pink { color: var(--neon-pink); font-weight: 600; }

        .socials {
            display: flex;
            gap: 15px;
            margin-bottom: 60px;
        }

        .s-btn {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            text-decoration: none;
            transition: 0.3s;
        }

        .s-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            transform: translateY(-4px);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 100px 20px;
        }

        .section-title {
            font-family: var(--font-title);
            font-size: 2.2rem;
            text-transform: uppercase;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 50px;
            backdrop-filter: blur(10px);
        }

        @media(max-width: 768px) {
            h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="logo">DX</div>
        <h1>DEXTANO</h1>
        <p class="tagline">
            15 Years Architecting Hits. Industry-standard <span class="cyan">Pro Tools</span> mixing and elite <span class="pink">FL Studio</span> live performance workflow.
        </p>
        <div class="socials">
            <a href="https://instagram.com" target="_blank" class="s-btn"><i class="fab fa-instagram"></i></a>
            <a href="https://tiktok.com" target="_blank" class="s-btn"><i class="fab fa-tiktok"></i></a>
            <a href="https://kick.com" target="_blank" class="s-btn"><i class="fa-solid fa-play"></i></a>
            <a href="https://spotify.com" target="_blank" class="s-btn"><i class="fab fa-spotify"></i></a>
        </div>
    </div>

    <div class="container">
        <div class="section-title">Audio Deployment</div>
        <div class="card">
            <iframe style="border-radius:20px" src="https://spotify.com" width="100%" height="380" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </div>

</body>
</html>
