<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEXTA NO SE SALVAN | Audio Architect</title>
    <!-- FUENTES PREMIUM MINIMALISTAS -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- ICONOS CON CARGA SEGURA MUNDIAL -->
    <link rel="stylesheet" href="https://cloudflare.com" crossorigin="anonymous" />
    
    <style>
        :root {
            --bg-pure: #ffffff;
            --text-dark: #000000;
            --text-muted: #71717a;
            --font-header: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-dark);
            font-family: var(--font-body);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- CABECERA ESTILO PHARRELL CON TU LOGO VERDADERO CENTRADO --- */
        header {
            text-align: center;
            padding: 40px 0 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 2px solid var(--text-dark);
            margin-bottom: 30px;
        }

        /* Tu logo real inyectado como texto-gráfico de alta escala */
        .logo-box-urban {
            font-family: var(--font-header);
            font-size: 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1;
            color: var(--bg-pure);
            background-color: var(--text-dark);
            padding: 12px 30px;
            border: 3px solid var(--text-dark);
            transform: rotate(-1.5deg);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            display: inline-block;
        }

        .social-top-row {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .social-top-row a {
            color: var(--text-dark);
            font-size: 1.3rem;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .social-top-row a:hover {
            transform: translateY(-2px);
            opacity: 0.7;
        }

        /* --- DISTRIBUCIÓN EXCLUSIVA ESTILO PHARRELL WILLIAMS --- */
        .workspace-layout {
            display: grid;
            grid-template-columns: 42% 58%;
            gap: 40px;
            align-items: start;
        }

        /* Área Izquierda: Tu Avatar o Foto */
        .avatar-zone {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-box {
            width: 100%;
            max-width: 300px;
            padding-bottom: 120%;
            background-color: #f8f8f9;
            border: 2px dashed var(--text-dark);
            position: relative;
            margin-bottom: 20px;
        }

        .avatar-box-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        .listen-tag {
            font-family: var(--font-header);
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dark);
            border-bottom: 2px solid var(--text-dark);
            padding-bottom: 2px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .listen-tag:hover { opacity: 0.6; }

        /* Área Derecha: Menú de Categorías Interactivas */
        .interactive-menu {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .category-nav {
            display: flex;
            gap: 20px;
            border-bottom: 2px solid var(--text-dark);
            padding-bottom: 12px;
            margin-bottom: 5px;
        }

        .cat-btn {
            font-family: var(--font-header);
            font-size: 0.95rem;
            font-weight: 700;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            transition: color 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            color: var(--text-dark);
        }

        .cat-btn.active::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--text-dark);
        }

        /* --- PANELES CONTENEDORES DINÁMICOS --- */
        .tab-pane {
            display: none;
            animation: fadeInPharrell 0.3s ease-out forwards;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeInPharrell {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .items-display-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .didactic-item {
            border: 2px solid var(--text-dark);
            padding: 18px 10px;
            text-align: center;
            font-family: var(--font-header);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            background-color: var(--bg-pure);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .didactic-item:hover {
            transform: scale(1.03) rotate(1deg);
        }

        .didactic-item i { font-size: 1.5rem; }

        .info-box-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #18181b;
            background-color: #fafafa;
            border: 1px solid #e4e4e7;
            padding: 25px;
        }

        .info-box-text p { margin-bottom: 12px; }
        .info-box-text p:last-child { margin-bottom: 0; }

        .display-placeholder {
            width: 100%;
            padding-bottom: 58%;
            background-color: #fafafa;
            border: 1px solid #e4e4e7;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }

        .display-placeholder-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-muted);
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
            padding: 0 10px;
        }

        /* --- SECCIÓN CONCEPTO --- */
        .brand-meaning {
            margin-top: 30px;
            border-top: 1px solid #000;
            padding-top: 20px;
        }

        .brand-meaning h2 {
            font-family: var(--font-header);
            font-size: 1.2rem;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .brand-meaning p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .brand-meaning p span {
            color: var(--text-dark);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .workspace-layout { grid-template-columns: 1fr; gap: 40px; }
            header { padding-top: 20px; }
            .logo-box-urban { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- CABECERA ESTILO CORREGIDO CON LOGO INTEGRADO ASIMÉTRICO -->
        <header>
            <div class="logo-box-urban">Dexta No Se Salvan</div>
            
            <div class="social-top-row">
                <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://tiktok.com" target="_blank"><i class="fab fa-tiktok"></i></a>
                <a href="https://kick.com" target="_blank"><i class="fa-solid fa-play"></i></a>
                <a href="https://spotify.com" target="_blank"><i class="fab fa-spotify"></i></a>
            </div>
        </header>

        <!-- ESPACIO DE TRABAJO DIDÁCTICO -->
        <div class="workspace-layout">
            
            <!-- COLUMNA IZQUIERDA: TU AVATAR -->
            <div class="avatar-zone">
                <div class="avatar-box">
                    <div class="avatar-box-text">
                        [ Sube aquí tu ilustración de personaje o foto PNG del estudio ]
                    </div>
                </div>
                <a href="https://spotify.com" target="_blank" class="listen-tag">Listen to my Beats</a>
            </div>

            <!-- COLUMNA DERECHA: PANELES INTERACTIVOS INTERCAMBIABLES -->
            <div class="interactive-menu">
                <div>
                    <!-- NAVEGACIÓN ENTRE PESTAÑAS (TABS) -->
                    <div class="category-nav">
