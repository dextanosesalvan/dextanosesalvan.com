<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dextano | Multi-Genre Audio Architect</title>
    <!-- FUENTES ULTRA LUXURY DE GOOGLE FONTS -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- ICONOS PROFESIONALES -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        :root {
            --bg-dark: #030306;
            --panel-glass: rgba(10, 10, 18, 0.75);
            --border-glass: rgba(255, 255, 255, 0.03);
            --neon-cyan: #00f2fe;
            --neon-pink: #ff007f;
            --neon-purple: #7f00ff;
            --font-luxury: 'Syne', sans-serif;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: var(--font-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- PARALLAX CINEMATOGRÁFICO DE FONDO --- */
        .luxury-hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* REEMPLAZA ESTE ENLACE CON TU MEJOR FOTO EN EL ESTUDIO */
            background-image: linear-gradient(to bottom, rgba(3, 3, 6, 0.4), var(--bg-dark)), 
                              url('https://unsplash.com');
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            text-align: center;
            padding: 120px 24px;
        }

        #particles-mesh {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.25;
            z-index: 1;
        }

        .hero-inner {
            position: relative;
            z-index: 2;
            max-width: 1000px;
        }

        /* --- LOGO LED FLOTANTE --- */
        .brand-logo {
            width: 85px;
            height: 85px;
            margin: 0 auto 35px auto;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.05) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-luxury);
            font-weight: 800;
            font-size: 1.8rem;
            color: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
            50% { transform: translateY(-10px); box-shadow: 0 25px 50px rgba(0, 242, 254, 0.15); }
        }

        /* --- TIPOGRAFÍA ESTILO BILLBOARD --- */
        h1 {
            font-family: var(--font-luxury);
            font-size: 6.5rem;
            font-weight: 800;
            letter-spacing: -4px;
            line-height: 0.85;
            text-transform: uppercase;
            margin-bottom: 30px;
            background: linear-gradient(180deg, #ffffff 40%, rgba(255,255,255,0.4) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* FRASES ULTRA-CHIMBAS EN LUGAR DE PÁRRAFOS VACIÓS */
        .luxury-punchline {
            font-family: var(--font-luxury);
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            max-width: 850px;
            margin: 0 auto 50px auto;
            line-height: 1.3;
            color: #e2e8f0;
        }

        .luxury-punchline span.cyan { color: var(--neon-cyan); text-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }
        .luxury-punchline span.pink { color: var(--neon-pink); text-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }

        /* --- REDES SOCIALES CON ICONOS REALES --- */
        .social-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .btn-social {
            width: 55px;
            height: 55px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.6);
            font-size: 1.3rem;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            backdrop-filter: blur(10px);
        }

        .btn-social:hover {
            transform: translateY(-8px) scale(1.05);
            color: #fff;
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 15px 30px rgba(255,255,255,0.1);
        }

        .btn-social.insta:hover { color: #e1306c; border-color: #e1306c; box-shadow: 0 10px 25px rgba(225, 48, 108, 0.2); }
        .btn-social.tiktok:hover { color: #00f2fe; border-color: #00f2fe; box-shadow: 0 10px 25px rgba(0, 242, 254, 0.2); }
        .btn-social.kick:hover { color: #53fc18; border-color: #53fc18; box-shadow: 0 10px 25px rgba(83, 252, 24, 0.2); }
        .btn-social.spoty:hover { color: #1ed760; border-color: #1ed760; box-shadow: 0 10px 25px rgba(30, 215, 96, 0.2); }

        /* --- DISEÑO DE CONTENIDO PREMIUM --- */
        .section-wrap {
            padding: 120px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        h2 {
            font-family: var(--font-luxury);
            font-size: 3rem;
            letter-spacing: -2px;
            text-transform: uppercase;
            margin-bottom: 60px;
            background: linear-gradient(90deg, #fff, #555);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-vault {
            background: var(--panel-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass);
            border-radius: 40px;
            padding: 50px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.6);
        }

        /* GRID ASIMÉTRICO DE TARJETAS (ESTILO TOO LOST ACTUALIZADO) */
        .luxury-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
        }

        .vault-card {
            background: rgba(255,255,255,0.01);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .vault-card:hover {
            transform: translateY(-12px);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .display-box {
            position: relative;
            padding-bottom: 68%;
            background: #08080c;
            overflow: hidden;
        }

        .display-box img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .vault-card:hover .display-box img {
            transform: scale(1.06);
        }

        .card-details {
            padding: 30px;
        }

        .luxury-badge {
            display: inline-block;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        /* --- AGENCIA BOOKING FORM --- */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        input, textarea {
            width: 100%;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.04);
            color: #fff;
            padding: 22px;
            border-radius: 18px;
            font-size: 1rem;
            font-family: var(--font-main);
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.8);
        }

        .btn-luxury-send {
            grid-column: span 2;
            background: #ffffff;
            color: #000000;
            font-family: var(--font-luxury);
            font-weight: 800;
            border: none;
            padding: 24px;
            border-radius: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .btn-luxury-send:hover {
            background: var(--neon-cyan);
            box-shadow: 0 15px 40px rgba(0, 242, 254, 0.4);
            transform: translateY(-2px);
        }
